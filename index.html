<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaStore — Premium Software</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/ui-layout.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/style.css"> 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

  <header>
    <div class="logo" id="particle-logo">Nexa<span>Store</span></div>
    <button id="navCartBtn" class="btn-secondary" style="width: auto; padding: 10px 20px; font-size: 14px;" onclick="window.location.href='checkout.html'">Cart (0)</button>
  </header>

  <section class="hero">
    <div class="hero-content">
      <div class="hero-eyebrow">✦ TOP SELLER</div>
      <h1 class="hero-title" id="animated-title">XSSNow Scanner<br>Framework</h1>
      <p class="hero-desc" id="animated-desc">The ultimate automated pipeline for discovering Cross-Site Scripting vulnerabilities. Built for speed, precision, and zero false positives.</p>
      <div class="hero-btns">
        <button class="btn-primary" onclick="window.location.href='checkout.html'">➔ Purchase Now</button>
        <button class="btn-secondary" onclick="window.scrollTo({top: 800, behavior: 'smooth'})">View Details</button>
      </div>
    </div>
    <div class="scroll-indicator">
      <span>Scroll</span>
      <div class="scroll-icon">↓</div>
    </div>
  </section>

  <section class="row-container">
    <h2 class="row-title">Trending Developer Tools</h2>
    <div class="slider"></div>
  </section>

  <div id="detailsModal" class="modal-overlay">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">×</button>
      
      <div class="modal-hero">
        <img id="modalImg" src="" alt="Software" onerror="this.onerror=null; this.src='https://via.placeholder.com/600x400/1e1e2f/e63f6f?text=Image+Not+Found';">
      </div>
      
      <div class="modal-body">
        <div class="modal-info-section">
          <h2 class="modal-title" id="modalTitle">Title</h2>
          <p class="modal-desc" id="modalDesc">Description</p>
        </div>
        
        <div class="modal-sidebar">
          <h3 class="modal-price" id="modalPrice">₹0</h3>
          <button id="modalAddToCartBtn">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>
  
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAyknjeM9e8lvwBeogJvAly4834VpdoHiI",
      authDomain: "nexastore-42d24.firebaseapp.com",
      databaseURL: "https://nexastore-42d24-default-rtdb.firebaseio.com",
      projectId: "nexastore-42d24",
      storageBucket: "nexastore-42d24.firebasestorage.app",
      messagingSenderId: "671073555026",
      appId: "1:671073555026:web:d28e98db87f6070308058b"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    window.db = firebase.database(); 
    window.softwares = [];
  </script>
  
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/index-main.js"></script> 
</body>
</html>
