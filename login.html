<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — NexaStore</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* 🔥 GLOBAL & COLORS 🔥 */
    :root {
      --accent: #e63f6f; 
      --bg: #050505; 
      --card: #0a0a0a; 
      --border: rgba(255, 255, 255, 0.1);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: radial-gradient(circle at top center, rgba(230, 63, 111, 0.05), transparent 50%);
    }

    .logo-header {
      position: absolute;
      top: 30px;
      left: 30px;
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
    }
    .logo-header span { color: var(--accent); }

    /* 🔥 SINGLE CARD WRAPPER 🔥 */
    .bento-wrapper {
      width: 100%;
      max-width: 450px; /* Perfect width for login card */
      margin: 0 auto;
    }

    /* 🔥 BENTO CARD STYLES 🔥 */
    .bento-item {
      position: relative;
      padding: 30px 24px;
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.3s ease;
      border: 1px solid var(--border);
      background-color: var(--card);
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 1;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .bento-dot-bg {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 1;
      background-image: radial-gradient(circle at center, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 4px 4px;
    }

    .bento-gradient-overlay {
      position: absolute;
      inset: 0;
      z-index: -2;
      border-radius: 16px;
      padding: 1px;
      background: linear-gradient(to bottom right, transparent, rgba(255, 255, 255, 0.08), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 1;
    }

    .bento-header { display: flex; align-items: center; justify-content: space-between; }
    .bento-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.1); }
    .bento-status { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 8px; color: var(--text-main); backdrop-filter: blur(4px); background: rgba(50, 255, 126, 0.15); color: #32ff7e; }

    .bento-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
    .bento-meta { font-size: 12px; font-weight: 400; font-family: 'DM Sans', sans-serif; color: var(--text-muted); }
    .bento-desc { font-size: 14px; color: var(--text-muted); line-height: 1.5; font-weight: 400; }

    .bento-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 10px; }
    .bento-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .bento-tag { font-size: 11px; padding: 4px 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); color: var(--text-main); }

    /* 🔥 LOGIN FORM SPECIFIC 🔥 */
    .login-form { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
    .input-wrapper { display: flex; flex-direction: column; gap: 6px; }
    .input-wrapper label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-wrapper input { padding: 14px 16px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); color: white; border-radius: 10px; font-size: 14px; outline: none; font-family: 'DM Sans', sans-serif; transition: border-color 0.3s, background 0.3s; }
    .input-wrapper input:focus { border-color: var(--accent); background: rgba(230, 63, 111, 0.05); }

    .login-btn { background: var(--text-main); color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: transform 0.2s, background 0.2s; margin-top: 5px; }
    .login-btn:hover { background: #fff; transform: translateY(-2px); }
    .login-btn:active { transform: translateY(0); }

    #error-msg { color: #ff4757; font-size: 13px; text-align: center; display: none; background: rgba(255, 71, 87, 0.1); padding: 8px; border-radius: 8px; border: 1px solid rgba(255, 71, 87, 0.2); }
  </style>
</head>
<body>

  <div class="logo-header">Nexa<span>Admin</span></div>

  <div class="bento-wrapper">
    <div class="bento-item persistent-hover">
      <div class="bento-dot-bg"></div>
      <div class="bento-gradient-overlay"></div>

      <div class="bento-header">
        <div class="bento-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e63f6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M8.5 14c1.5-1 3.5-1 5 0"></path><circle cx="12" cy="10" r="2"></circle></svg>
        </div>
        <span class="bento-status">Secured Portal</span>
      </div>

      <div>
        <h3 class="bento-title">Admin Access <span class="bento-meta">v2.4.1</span></h3>
        <p class="bento-desc">Sign in to manage products, view real-time orders, and approve UTR payments.</p>
      </div>

      <div class="login-form">
        <div class="input-wrapper">
          <label>Admin Email</label>
          <input type="email" id="adminEmail" placeholder="admin@nexastore.com">
        </div>
        <div class="input-wrapper">
          <label>Password</label>
          <input type="password" id="adminPassword" placeholder="••••••••">
        </div>
        <div id="error-msg">Incorrect Email or Password!</div>
        <button class="login-btn" id="loginBtn" onclick="loginAdmin()">Authorize Access →</button>
      </div>

      <div class="bento-footer">
        <div class="bento-tags">
          <span class="bento-tag">#Authentication</span>
          <span class="bento-tag">#Admin</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAyknjeM9e8lvwBeogJvAly4834VpdoHiI",
      authDomain: "nexastore-42d24.firebaseapp.com",
      projectId: "nexastore-42d24",
      appId: "1:671073555026:web:d28e98db87f6070308058b"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    // Check if admin is already logged in
    auth.onAuthStateChanged(user => {
      if (user) {
        window.location.href = "admin.html"; 
      }
    });

    // Login Function
    function loginAdmin() {
      const email = document.getElementById('adminEmail').value;
      const pass = document.getElementById('adminPassword').value;
      const errorMsg = document.getElementById('error-msg');
      const btn = document.getElementById('loginBtn');
      
      if(!email || !pass) {
        errorMsg.innerText = "Please fill both email and password!";
        errorMsg.style.display = "block";
        return;
      }

      btn.innerText = "Verifying...";
      errorMsg.style.display = "none";

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => {
          btn.style.background = "#32ff7e";
          btn.innerText = "Access Granted ✓";
          setTimeout(() => {
            window.location.href = "admin.html";
          }, 500);
        })
        .catch((error) => {
          btn.innerText = "Authorize Access →";
          errorMsg.innerText = "Incorrect Email or Password! Access Denied.";
          errorMsg.style.display = "block";
          
          const form = document.querySelector('.login-form');
          form.style.transform = "translateX(5px)";
          setTimeout(() => form.style.transform = "translateX(-5px)", 100);
          setTimeout(() => form.style.transform = "translateX(0)", 200);
        });
    }

    // Trigger login on Enter key
    document.getElementById('adminPassword').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          loginAdmin();
        }
    });
  </script>
</body>
</html>
